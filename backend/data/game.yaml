# 世界与玩法配置

town_name: 合租小屋
player_name: 你            # 玩家在 NPC 眼里的默认称呼；玩家自报姓名后会记进玩家档案

locations:
  卧室: 左上角的卧室，有衣柜和榻榻米
  客厅: 上方的客厅，有暖桌
  厨房: 右上方的厨房，有灶台和水槽
  电脑桌: 右下方的电脑桌，打游戏的地方
  茶桌: 中间的茶桌，适合喝茶聊天
  火锅桌: 左下方的矮桌，大家一起吃饭的地方
  走廊: 屋子中间的过道

affinity_levels:            # 从高到低，min 为下限
  - {name: 挚友, min: 80, style: 非常亲近，像老朋友一样无话不谈，愿意分享秘密和私人话题}
  - {name: 亲密, min: 60, style: 热情友好，愿意多聊，会主动关心对方}
  - {name: 友好, min: 40, style: 礼貌友善，正常交流}
  - {name: 熟悉, min: 20, style: 客气但有点生疏，回答偏简短}
  - {name: 陌生, min: 0, style: 冷淡疏离，不太想多说}

moods: [开心, 平静, 疲惫, 兴奋, 烦躁, 无聊, 困, 元气满满]

emotions: [开心, 害羞, 惊讶, 生气, 难过, 无语, 得意, 思考, 平静]

items:
  蛋糕: 甜甜的草莓蛋糕
  花: 一束向日葵
  游戏卡带: 最新的双人合作游戏卡带
  泡面: 一桶红烧牛肉面
  能量饮料: 一罐冰镇能量饮料
  电话卡: 一张流量超多的电话卡

starting_inventory: {蛋糕: 1, 花: 1, 泡面: 2, 能量饮料: 1}

# 随机话题种子（对话时有一定概率抽一条，让聊天更随机）
topic_seeds:
  - 刚刚手机上刷到一个很好笑的视频
  - 最近天气变化很大
  - 冰箱里的东西好像被人偷吃了
  - 想起小时候的一件趣事
  - 最近在纠结一个选择
  - 楼下新开了一家店
  - 昨晚做了一个奇怪的梦
  - 家里的 Wi-Fi 又变慢了
  - 想周末一起出去玩
  - 房租快到期了

# 导演面板里的预设世界事件
event_presets:
  - 外面突然下起了大雨
  - 停电了五分钟又恢复了
  - 有人在门口放了一个神秘快递
  - 楼上传来很大的装修声
  - 房东发消息说下个月要涨房租
  - 冰箱里出现了一块没人认领的蛋糕
  - wana 在朋友圈发了一张和别人的合照

randomness:
  topic_seed_chance: 0.35     # 每轮对话注入随机话题的概率
  memory_callback_chance: 0.25 # 主动提起旧事的概率
  quest_chance: 0.12          # 每轮对话后 NPC 提出委托的概率
  npc_chat_chance: 0.25       # 两个 NPC 在同一地点时每个游戏小时互聊的概率
  monologue_minutes: 90       # 每隔多少游戏分钟生成一次头顶独白
